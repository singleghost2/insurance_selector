{% extends "base.html" %}
{% block title %}上传保险条款{% endblock %}
{% block content %}
<h2>上传保险条款</h2>
<article>
  <form id="policy-upload-form">
    <label>条款 PDF 文件
      <input type="file" name="file" accept=".pdf" required>
    </label>
    <p class="muted">
      建议从保险公司官网或销售页面下载「保险条款」原文 PDF（通常 30-100 页）。
      文字版 PDF 分析约 1-3 分钟；扫描版需要逐页识别，耗时和费用都更高。
    </p>
    <button type="submit">开始分析</button>
  </form>
</article>
{% endblock %}
{% block scripts %}
<script>bindUploadForm("policy-upload-form", "/api/products/upload");</script>
{% endblock %}
